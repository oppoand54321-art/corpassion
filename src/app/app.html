<video #bgVideo class="bg-video" autoplay muted loop playsinline>
  <source src="/videos/app_logo.mp4" type="video/mp4" />
</video>

<nav class="side-headings">
  <button
    *ngFor="let item of items"
    type="button"
    class="heading"
    [class.active]="activeKey === item.key"
    (mouseenter)="openCard(item.key)"
    (mouseleave)="scheduleClose()"
    (click)="openCard(item.key)">
    {{ item.title }}
  </button>
</nav>

<article
  class="glass-card"
  [class.open]="cardOpen"
  [ngClass]="activeItem?.tone || ''"
  (mouseenter)="keepOpen()"
  (mouseleave)="scheduleClose()">
  <p class="kicker">{{ activeItem?.kicker }}</p>
  <h2>{{ activeItem?.title }}</h2>
  <p class="line">{{ activeItem?.line1 }}</p>
  <p class="line">{{ activeItem?.line2 }}</p>
  <p class="body" *ngIf="activeItem?.body">{{ activeItem?.body }}</p>
</article>

<video #waterVideo class="water" autoplay muted loop playsinline>
  <source src="/videos/water.mp4" type="video/mp4" />
</video>
